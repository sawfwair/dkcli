  <text x="54" y="94" fill="#6e6057" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17">Seed #D96F32 resolves into inspectable colors, contrast checks, motion, layout, and token output.</text>

