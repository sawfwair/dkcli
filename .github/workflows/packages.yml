name: Packages

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package-verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build:packages
      - name: Publint
        run: pnpm publint
      - name: Pack dry runs
        run: pnpm pack:packages:dry
