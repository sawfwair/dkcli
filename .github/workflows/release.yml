name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Release verify
        run: pnpm release:verify
      - name: Detect release mode
        id: release-mode
        shell: bash
        run: |
          set -euo pipefail
          changeset_count=$(find .changeset -maxdepth 1 -name '*.md' | wc -l | tr -d ' ')
          if [[ "${changeset_count}" != "0" ]]; then
            echo "mode=changesets" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version_changed=0
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            version_changed=$(node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';

          const files = [
            'package.json',
            'packages/core/package.json',
            'packages/tokens/package.json',
            'packages/components/package.json'
          ];

          function currentVersion(file) {
            return JSON.parse(readFileSync(file, 'utf8')).version ?? '';
          }

          function previousVersion(file) {
            try {
              return JSON.parse(execFileSync('git', ['show', `HEAD^:${file}`], { encoding: 'utf8' })).version ?? '';
            } catch {
              return '';
            }
          }

          process.stdout.write(files.some((file) => previousVersion(file) !== currentVersion(file)) ? '1' : '0');
          NODE
            )
          else
            echo "No parent commit available; skipping publish-versioned detection." >&2
          fi

          if [[ "${version_changed}" == "1" ]]; then
            echo "mode=publish-versioned" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release PR or publish via Changesets
        if: steps.release-mode.outputs.mode == 'changesets'
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          publish: pnpm -r publish --access public --provenance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish versioned packages
        if: steps.release-mode.outputs.mode == 'publish-versioned'
        run: pnpm -r publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
