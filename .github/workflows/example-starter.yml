name: Example Starter

on:
  push:
    branches: [main]
  pull_request:

jobs:
  starter-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify starter against packed artifacts
        run: pnpm example:verify
      - name: Install Chromium for the SvelteKit consumer
        run: pnpm dlx playwright@1.58.2 install --with-deps chromium
      - name: Verify the SvelteKit application against packed artifacts
        run: pnpm example:sveltekit:verify
