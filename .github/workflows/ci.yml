name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check:strict

      - name: Test
        run: pnpm test

      - name: Coverage
        run: pnpm test:coverage

      - name: Install Chromium for component geometry
        run: pnpm exec playwright install --with-deps chromium

      - name: Check component hit regions
        run: pnpm check:component-targets

      - name: Build
        run: pnpm build

      - name: Check exact reviewed mathematical findings
        run: pnpm check:release:math
